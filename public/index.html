<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EGSTORE - Engineering Store Inventory</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  @media print {
    body * { visibility: hidden; }
    #qr-print-area, #qr-print-area * { visibility: visible; }
    #qr-print-area { position: absolute; top: 0; left: 0; width: 100%; }
    .no-print { display: none !important; }
  }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background:#f4f6f9; }
  .navy { color:#1e3a5f; }
  .bg-navy { background-color:#1e3a5f; }
  .bg-orange { background-color:#e58e26; }
  .badge-crit { background:#fdecea; color:#c0392b; }
  .badge-most { background:#fdecea; color:#8e0000; font-weight:600; }
</style>
</head>
<body class="min-h-screen">

<div id="app"></div>

<script>
const API = ""; // same origin
let state = { token: localStorage.getItem("eg_token") || null, user: JSON.parse(localStorage.getItem("eg_user") || "null"), view: "dashboard", page:1 };

function saveAuth(token, user) {
  state.token = token; state.user = user;
  localStorage.setItem("eg_token", token);
  localStorage.setItem("eg_user", JSON.stringify(user));
}
function logout() {
  state.token = null; state.user = null;
  localStorage.removeItem("eg_token"); localStorage.removeItem("eg_user");
  render();
}

async function api(path, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  const res = await fetch(API + path, Object.assign({}, opts, { headers }));
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { logout(); throw new Error("Session expired"); }
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

// ---------------- LOGIN ----------------
function renderLogin() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(el(`
    <div class="min-h-screen flex items-center justify-center">
      <div class="bg-white shadow-xl rounded-2xl p-10 w-96">
        <div class="text-center mb-6">
          <div class="text-3xl font-extrabold navy">EGSTORE</div>
          <div class="text-sm text-gray-500">All Your Engineering Needs</div>
        </div>
        <div id="login-err" class="text-red-600 text-sm mb-3 hidden"></div>
        <input id="li-user" placeholder="Username" class="w-full border rounded-lg px-3 py-2 mb-3" />
        <input id="li-pass" type="password" placeholder="Password" class="w-full border rounded-lg px-3 py-2 mb-4" />
        <button id="li-btn" class="w-full bg-navy text-white rounded-lg py-2 font-semibold">Log In</button>
      </div>
    </div>
  `));
  document.getElementById("li-btn").onclick = async () => {
    const username = document.getElementById("li-user").value.trim();
    const password = document.getElementById("li-pass").value;
    try {
      const data = await api("/api/auth/login", { method: "POST", body: JSON.stringify({ username, password }) });
      saveAuth(data.token, data.user);
      render();
    } catch (e) {
      const box = document.getElementById("login-err");
      box.textContent = e.message; box.classList.remove("hidden");
    }
  };
}

// ---------------- SHELL ----------------
function shell(contentHtml) {
  const role = state.user.role;
  const nav = [
    { id: "dashboard", label: "Dashboard", roles: ["admin","store_incharge","issuer"] },
    { id: "items", label: "Items", roles: ["admin","store_incharge","issuer"] },
    { id: "issue", label: "Request / Issue", roles: ["admin","store_incharge","issuer"] },
    { id: "approvals", label: "Approvals", roles: ["admin","store_incharge"] },
    { id: "issuelog", label: "Issue Log", roles: ["admin","store_incharge"] },
    { id: "indents", label: "Purchase Indents", roles: ["admin","store_incharge"] },
    { id: "qrcodes", label: "QR Codes", roles: ["store_incharge"] },
    { id: "bulkreceipt", label: "Bulk Receipt (AI)", roles: ["store_incharge"] },
    { id: "users", label: "Users", roles: ["store_incharge"] },
  ].filter(n => n.roles.includes(role));

  return `
    <div class="min-h-screen">
      <header class="bg-navy text-white px-6 py-3 flex items-center justify-between shadow">
        <div class="font-extrabold text-xl">EGSTORE</div>
        <nav class="flex gap-1">
          ${nav.map(n => `<button data-nav="${n.id}" class="px-3 py-1.5 rounded-lg text-sm ${state.view===n.id ? 'bg-orange font-semibold' : 'hover:bg-white/10'}">${n.label}</button>`).join("")}
        </nav>
        <div class="flex items-center gap-3 text-sm">
          <span>${state.user.name} <span class="opacity-70">(${role.replace('_',' ')})</span></span>
          <button id="logout-btn" class="bg-white/10 px-3 py-1 rounded-lg hover:bg-white/20">Log out</button>
        </div>
      </header>
      <main class="p-6 max-w-7xl mx-auto">${contentHtml}</main>
    </div>
  `;
}

function bindShell() {
  document.querySelectorAll("[data-nav]").forEach(btn => {
    btn.onclick = () => { state.view = btn.getAttribute("data-nav"); state.page = 1; render(); };
  });
  document.getElementById("logout-btn").onclick = logout;
}

// ---------------- DASHBOARD ----------------
async function renderDashboard() {
  const app = document.getElementById("app");
  app.innerHTML = shell(`<div id="dash-content" class="text-gray-500">Loading...</div>`);
  bindShell();
  try {
    const summary = await api("/api/dashboard/summary");
    const low = await api("/api/dashboard/low-stock");
    const cards = [
      { label: "Total Items", value: summary.total_items, color: "bg-navy" },
      { label: "Stock Value (₹)", value: summary.stock_value.toLocaleString("en-IN"), color: "bg-navy" },
      { label: "Below Threshold", value: summary.low_stock_count, color: "bg-red-600" },
      { label: "Pending Approvals", value: summary.pending_approvals, color: "bg-orange" },
      { label: "Open Purchase Indents", value: summary.open_indents, color: "bg-orange" },
    ];
    const content = `
      <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
        ${cards.map(c => `
          <div class="rounded-xl p-4 text-white ${c.color} shadow">
            <div class="text-2xl font-bold">${c.value}</div>
            <div class="text-xs opacity-90 mt-1">${c.label}</div>
          </div>`).join("")}
      </div>
      <div class="bg-white rounded-xl shadow p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-bold navy text-lg">Items Below Reorder Level (ROL)</h2>
          ${state.user.role !== "issuer" ? `<button id="gen-indents" class="bg-orange text-white text-sm px-3 py-1.5 rounded-lg">Generate Purchase Indents</button>` : ""}
        </div>
        <div class="overflow-auto max-h-[480px]">
        <table class="w-full text-sm">
          <thead class="text-left text-gray-500 border-b sticky top-0 bg-white">
            <tr><th class="py-2">SAP Code</th><th>Description</th><th>UoM</th><th>Current</th><th>ROL</th><th>ROQ</th><th>Critical</th><th>Vendor</th></tr>
          </thead>
          <tbody>
            ${low.items.map(i => `
              <tr class="border-b hover:bg-gray-50">
                <td class="py-1.5 font-mono text-xs">${i.sap_code}</td>
                <td>${i.description}</td>
                <td>${i.uom||''}</td>
                <td class="font-semibold text-red-600">${i.current_stock}</td>
                <td>${i.rol}</td>
                <td>${i.roq}</td>
                <td>${i.critical_category ? `<span class="text-xs px-2 py-0.5 rounded-full ${i.critical_category==='MOST CRITICAL'?'badge-most':'badge-crit'}">${i.critical_category}</span>` : ''}</td>
                <td class="text-xs text-gray-500">${i.vendor_name||''}</td>
              </tr>`).join("")}
          </tbody>
        </table>
        </div>
      </div>
    `;
    document.getElementById("dash-content").outerHTML = `<div>${content}</div>`;
    const genBtn = document.getElementById("gen-indents");
    if (genBtn) genBtn.onclick = async () => {
      genBtn.disabled = true; genBtn.textContent = "Generating...";
      try {
        const r = await api("/api/purchase-indents/generate", { method: "POST" });
        alert(`Created ${r.created} new purchase indent(s).`);
        renderDashboard();
      } catch (e) { alert(e.message); }
    };
  } catch (e) {
    document.getElementById("dash-content").textContent = "Error: " + e.message;
  }
}

// ---------------- ITEMS ----------------
async function renderItems() {
  const app = document.getElementById("app");
  app.innerHTML = shell(`
    <div class="bg-white rounded-xl shadow p-4">
      <div class="flex gap-2 mb-4">
        <input id="item-search" placeholder="Search by description, SAP code, machine..." class="flex-1 border rounded-lg px-3 py-2 text-sm" />
        <button id="item-search-btn" class="bg-navy text-white px-4 rounded-lg text-sm">Search</button>
        ${state.user.role === "store_incharge" ? `<button id="new-item-btn" class="bg-orange text-white px-4 rounded-lg text-sm">+ New Item</button>` : ""}
      </div>
      <div id="new-item-form" class="hidden bg-gray-50 border rounded-lg p-4 mb-4"></div>
      <div id="items-list" class="text-gray-500">Loading...</div>
      <div id="items-pagination" class="flex justify-between items-center mt-3 text-sm"></div>
    </div>
  `);
  bindShell();
  document.getElementById("item-search-btn").onclick = () => { state.page = 1; loadItems(); };
  document.getElementById("item-search").addEventListener("keydown", (e) => { if (e.key === "Enter") { state.page = 1; loadItems(); } });
  const newBtn = document.getElementById("new-item-btn");
  if (newBtn) newBtn.onclick = () => toggleNewItemForm();
  await loadItems();
}

function toggleNewItemForm() {
  const box = document.getElementById("new-item-form");
  if (!box.classList.contains("hidden")) { box.classList.add("hidden"); box.innerHTML = ""; return; }
  box.classList.remove("hidden");
  box.innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-2 text-sm">
      <input id="ni-sap" placeholder="SAP Code (required)" class="border rounded-lg px-3 py-2 col-span-2" />
      <input id="ni-uom" placeholder="UoM (e.g. NO, KG)" class="border rounded-lg px-3 py-2" />
      <input id="ni-price" type="number" placeholder="Net price" class="border rounded-lg px-3 py-2" />
      <input id="ni-desc" placeholder="Description (required)" class="border rounded-lg px-3 py-2 col-span-2" />
      <input id="ni-stock" type="number" placeholder="Opening stock" class="border rounded-lg px-3 py-2" />
      <input id="ni-rol" type="number" placeholder="Reorder Level (ROL)" class="border rounded-lg px-3 py-2" />
      <input id="ni-roq" type="number" placeholder="Reorder Qty (ROQ)" class="border rounded-lg px-3 py-2" />
      <input id="ni-vendor" placeholder="Vendor name" class="border rounded-lg px-3 py-2" />
      <input id="ni-location" placeholder="Location" class="border rounded-lg px-3 py-2" />
      <input id="ni-machine" placeholder="Machine/Equipment" class="border rounded-lg px-3 py-2" />
    </div>
    <div id="ni-err" class="text-red-600 text-sm mb-2 hidden"></div>
    <button id="ni-submit" class="bg-navy text-white px-4 py-2 rounded-lg text-sm font-semibold">Create Item</button>
  `;
  document.getElementById("ni-submit").onclick = async () => {
    const errBox = document.getElementById("ni-err");
    const sap_code = document.getElementById("ni-sap").value.trim();
    const description = document.getElementById("ni-desc").value.trim();
    if (!sap_code || !description) { errBox.textContent = "SAP code and description are required."; errBox.classList.remove("hidden"); return; }
    try {
      await api("/api/items", { method: "POST", body: JSON.stringify({
        sap_code, description,
        uom: document.getElementById("ni-uom").value,
        net_price: parseFloat(document.getElementById("ni-price").value) || 0,
        current_stock: parseInt(document.getElementById("ni-stock").value) || 0,
        rol: parseInt(document.getElementById("ni-rol").value) || 0,
        roq: parseInt(document.getElementById("ni-roq").value) || 0,
        vendor_name: document.getElementById("ni-vendor").value,
        location: document.getElementById("ni-location").value,
        machine_equipment: document.getElementById("ni-machine").value,
      })});
      toggleNewItemForm();
      loadItems();
    } catch (e) { errBox.textContent = e.message; errBox.classList.remove("hidden"); }
  };
}

async function loadItems() {
  const q = document.getElementById("item-search").value.trim();
  try {
    const data = await api(`/api/items?q=${encodeURIComponent(q)}&page=${state.page}&page_size=50`);
    const listEl = document.getElementById("items-list");
    listEl.innerHTML = `
      <div class="overflow-auto max-h-[560px]">
      <table class="w-full text-sm">
        <thead class="text-left text-gray-500 border-b sticky top-0 bg-white">
          <tr><th class="py-2">SAP Code</th><th>Description</th><th>UoM</th><th>Stock</th><th>ROL</th><th>Price</th><th>Location</th><th>Machine</th></tr>
        </thead>
        <tbody>
          ${data.items.map(i => `
            <tr class="border-b hover:bg-gray-50 cursor-pointer" data-open="${i.sap_code}">
              <td class="py-1.5 font-mono text-xs">${i.sap_code}</td>
              <td>${i.description}</td>
              <td>${i.uom||''}</td>
              <td class="${i.current_stock<=i.rol?'text-red-600 font-semibold':''}">${i.current_stock}</td>
              <td>${i.rol}</td>
              <td>₹${i.net_price}</td>
              <td class="text-xs">${i.location||''}</td>
              <td class="text-xs">${i.machine_equipment||''}</td>
            </tr>`).join("")}
        </tbody>
      </table>
      </div>
    `;
    listEl.querySelectorAll("[data-open]").forEach(row => {
      row.onclick = () => { location.hash = "#/item/" + encodeURIComponent(row.getAttribute("data-open")); };
    });
    const totalPages = Math.max(1, Math.ceil(data.total / data.page_size));
    document.getElementById("items-pagination").innerHTML = `
      <div>${data.total} items found</div>
      <div class="flex gap-2 items-center">
        <button id="prev-page" class="px-3 py-1 border rounded-lg" ${state.page<=1?'disabled':''}>Prev</button>
        <span>Page ${state.page} / ${totalPages}</span>
        <button id="next-page" class="px-3 py-1 border rounded-lg" ${state.page>=totalPages?'disabled':''}>Next</button>
      </div>
    `;
    document.getElementById("prev-page").onclick = () => { if (state.page>1){ state.page--; loadItems(); } };
    document.getElementById("next-page").onclick = () => { if (state.page<totalPages){ state.page++; loadItems(); } };
  } catch (e) {
    document.getElementById("items-list").textContent = "Error: " + e.message;
  }
}

// ---------------- ISSUE / REQUEST ----------------
async function renderIssue() {
  const app = document.getElementById("app");
  app.innerHTML = shell(`
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white rounded-xl shadow p-4">
        <h2 class="font-bold navy mb-3">New Issue Request</h2>
        <div id="issue-err" class="text-red-600 text-sm mb-2 hidden"></div>
        <input id="iss-search" placeholder="Search item by SAP code or description" class="w-full border rounded-lg px-3 py-2 mb-2 text-sm" />
        <div id="iss-results" class="text-sm mb-3 max-h-40 overflow-auto border rounded-lg divide-y hidden"></div>
        <div id="iss-selected" class="text-sm mb-3 hidden p-2 bg-gray-50 rounded-lg"></div>
        <input id="iss-qty" type="number" min="1" placeholder="Quantity" class="w-full border rounded-lg px-3 py-2 mb-2 text-sm" />
        <input id="iss-machine" placeholder="Machine / equipment (optional)" class="w-full border rounded-lg px-3 py-2 mb-2 text-sm" />
        <textarea id="iss-purpose" placeholder="Purpose / remarks" class="w-full border rounded-lg px-3 py-2 mb-3 text-sm"></textarea>
        <button id="iss-submit" class="bg-orange text-white px-4 py-2 rounded-lg font-semibold" disabled>Submit Request</button>
      </div>
      <div class="bg-white rounded-xl shadow p-4">
        <h2 class="font-bold navy mb-3">My Requests</h2>
        <div id="my-requests" class="text-sm">Loading...</div>
      </div>
    </div>
  `);
  bindShell();
  let selected = null;
  const resultsBox = document.getElementById("iss-results");
  const selectedBox = document.getElementById("iss-selected");
  const submitBtn = document.getElementById("iss-submit");

  if (state.prefillItem) {
    selected = state.prefillItem;
    selectedBox.innerHTML = `<b>${selected.description}</b><br><span class="text-xs text-gray-500">${selected.sap_code} · Available: ${selected.current_stock} ${selected.uom||''}</span>`;
    selectedBox.classList.remove("hidden");
    document.getElementById("iss-search").value = selected.description;
    submitBtn.disabled = false;
    state.prefillItem = null;
  }

  document.getElementById("iss-search").addEventListener("input", async (e) => {
    const q = e.target.value.trim();
    if (q.length < 2) { resultsBox.classList.add("hidden"); return; }
    const data = await api(`/api/items?q=${encodeURIComponent(q)}&page_size=15`);
    resultsBox.innerHTML = data.items.map(i => `
      <div data-code="${i.sap_code}" class="p-2 hover:bg-gray-50 cursor-pointer">
        <div class="font-medium">${i.description}</div>
        <div class="text-xs text-gray-500">${i.sap_code} · Stock: ${i.current_stock} ${i.uom||''}</div>
      </div>`).join("") || `<div class="p-2 text-gray-400">No matches</div>`;
    resultsBox.classList.remove("hidden");
    resultsBox.querySelectorAll("[data-code]").forEach(row => {
      row.onclick = () => {
        const code = row.getAttribute("data-code");
        selected = data.items.find(i => i.sap_code === code);
        selectedBox.innerHTML = `<b>${selected.description}</b><br><span class="text-xs text-gray-500">${selected.sap_code} · Available: ${selected.current_stock} ${selected.uom||''}</span>`;
        selectedBox.classList.remove("hidden");
        resultsBox.classList.add("hidden");
        document.getElementById("iss-search").value = selected.description;
        submitBtn.disabled = false;
      };
    });
  });

  submitBtn.onclick = async () => {
    const errBox = document.getElementById("issue-err");
    errBox.classList.add("hidden");
    const qty = parseInt(document.getElementById("iss-qty").value);
    if (!selected || !qty || qty <= 0) { errBox.textContent = "Select an item and enter a valid quantity."; errBox.classList.remove("hidden"); return; }
    try {
      await api("/api/issues", { method: "POST", body: JSON.stringify({
        sap_code: selected.sap_code, qty_requested: qty,
        purpose: document.getElementById("iss-purpose").value,
        machine_ref: document.getElementById("iss-machine").value,
      })});
      selected = null; submitBtn.disabled = true;
      document.getElementById("iss-search").value = "";
      document.getElementById("iss-qty").value = "";
      document.getElementById("iss-purpose").value = "";
      document.getElementById("iss-machine").value = "";
      selectedBox.classList.add("hidden");
      loadMyRequests();
    } catch (e) {
      errBox.textContent = e.message; errBox.classList.remove("hidden");
    }
  };

  async function loadMyRequests() {
    const box = document.getElementById("my-requests");
    try {
      const data = await api("/api/issues?mine=true");
      box.innerHTML = data.issues.length ? `
        <div class="divide-y max-h-[500px] overflow-auto">
        ${data.issues.map(i => `
          <div class="py-2">
            <div class="flex justify-between">
              <span class="font-medium">${i.description}</span>
              <span class="text-xs px-2 py-0.5 rounded-full ${statusColor(i.status)}">${i.status}</span>
            </div>
            <div class="text-xs text-gray-500">Qty: ${i.qty_requested} · ${new Date(i.created_at).toLocaleString()}</div>
          </div>`).join("")}
        </div>` : `<div class="text-gray-400">No requests yet.</div>`;
    } catch (e) { box.textContent = "Error: " + e.message; }
  }
  loadMyRequests();
}

function statusColor(s) {
  return { pending: "bg-yellow-100 text-yellow-800", issued: "bg-green-100 text-green-800",
    rejected: "bg-red-100 text-red-800", approved: "bg-blue-100 text-blue-800" }[s] || "bg-gray-100";
}

// ---------------- APPROVALS ----------------
async function renderApprovals() {
  const app = document.getElementById("app");
  app.innerHTML = shell(`<div class="bg-white rounded-xl shadow p-4"><h2 class="font-bold navy mb-3">Pending Approvals</h2><div id="appr-list">Loading...</div></div>`);
  bindShell();
  await loadApprovals();
}
async function loadApprovals() {
  const box = document.getElementById("appr-list");
  try {
    const data = await api("/api/issues?status=pending");
    box.innerHTML = data.issues.length ? `
      <table class="w-full text-sm">
        <thead class="text-left text-gray-500 border-b"><tr><th class="py-2">Item</th><th>Qty</th><th>Requested By</th><th>Purpose</th><th>Stock</th><th>Date</th><th></th></tr></thead>
        <tbody>
        ${data.issues.map(i => `
          <tr class="border-b">
            <td class="py-2">${i.description}<div class="text-xs text-gray-400 font-mono">${i.sap_code}</div></td>
            <td>${i.qty_requested}</td>
            <td>${i.requested_by_name}</td>
            <td class="text-xs">${i.purpose||''}${i.machine_ref?` · ${i.machine_ref}`:''}</td>
            <td class="${i.current_stock<i.qty_requested?'text-red-600 font-semibold':''}">${i.current_stock}</td>
            <td class="text-xs">${new Date(i.created_at).toLocaleString()}</td>
            <td class="flex gap-2">
              <button data-approve="${i.id}" class="bg-green-600 text-white px-2 py-1 rounded text-xs">Approve</button>
              <button data-reject="${i.id}" class="bg-red-600 text-white px-2 py-1 rounded text-xs">Reject</button>
            </td>
          </tr>`).join("")}
        </tbody>
      </table>` : `<div class="text-gray-400">No pending requests.</div>`;
    box.querySelectorAll("[data-approve]").forEach(btn => btn.onclick = async () => {
      try { await api(`/api/issues/${btn.getAttribute("data-approve")}/approve`, { method: "POST" }); loadApprovals(); }
      catch (e) { alert(e.message); }
    });
    box.querySelectorAll("[data-reject]").forEach(btn => btn.onclick = async () => {
      const remarks = prompt("Reason for rejection (optional):") || "";
      try { await api(`/api/issues/${btn.getAttribute("data-reject")}/reject`, { method: "POST", body: JSON.stringify({ remarks }) }); loadApprovals(); }
      catch (e) { alert(e.message); }
    });
  } catch (e) { box.textContent = "Error: " + e.message; }
}

// ---------------- PURCHASE INDENTS ----------------
async function renderIndents() {
  const app = document.getElementById("app");
  app.innerHTML = shell(`
    <div class="bg-white rounded-xl shadow p-4">
      <div class="flex justify-between mb-3">
        <h2 class="font-bold navy">Purchase Indents</h2>

async function renderQRCodes() {
  const app = document.getElementById("app");
  app.innerHTML = shell(`
    <div class="bg-white rounded-xl shadow p-4 no-print">
      <h2 class="font-bold navy mb-3">Generate QR Codes for Item Racks</h2>
      <p class="text-sm text-gray-500 mb-3">Search items, select the ones you want to print, then print. Each code opens straight to that item's screen when scanned on this app's URL.</p>
      <div class="flex gap-2 mb-3">
        <input id="qr-search" placeholder="Search by description, SAP code, machine..." class="flex-1 border rounded-lg px-3 py-2 text-sm" />
        <button id="qr-search-btn" class="bg-navy text-white px-4 rounded-lg text-sm">Search</button>
      </div>
      <div id="qr-results" class="text-sm max-h-80 overflow-auto border rounded-lg divide-y mb-3"></div>
      <div class="flex gap-2">
        <button id="qr-select-all" class="border px-3 py-2 rounded-lg text-sm">Select All Shown</button>
        <button id="qr-generate" class="bg-orange text-white px-4 py-2 rounded-lg text-sm font-semibold">Generate Labels (<span id="qr-count">0</span> selected)</button>
        <button id="qr-print" class="hidden bg-navy text-white px-4 py-2 rounded-lg text-sm font-semibold">Print</button>
      </div>
    </div>
    <div id="qr-print-area" class="mt-6 grid grid-cols-3 gap-4"></div>
  `);
  bindShell();
  let selected = {};
  let lastResults = [];

  async function search() {
    const q = document.getElementById("qr-search").value.trim();
    const data = await api(`/api/items?q=${encodeURIComponent(q)}&page_size=100`);
    lastResults = data.items;
    document.getElementById("qr-results").innerHTML = data.items.map(i => `
      <label class="flex items-center gap-2 p-2 hover:bg-gray-50 cursor-pointer text-xs">
        <input type="checkbox" data-code="${i.sap_code}" ${selected[i.sap_code] ? "checked" : ""} />
        <span class="font-mono">${i.sap_code}</span> — ${i.description}
      </label>
    `).join("") || `<div class="p-2 text-gray-400">No matches</div>`;
    document.querySelectorAll("#qr-results input[type=checkbox]").forEach(cb => {
      cb.onchange = () => {
        const item = lastResults.find(i => i.sap_code === cb.getAttribute("data-code"));
        if (cb.checked) selected[item.sap_code] = item; else delete selected[item.sap_code];
        updateCount();
      };
    });
  }
  function updateCount() { document.getElementById("qr-count").textContent = Object.keys(selected).length; }

  document.getElementById("qr-search-btn").onclick = search;
  document.getElementById("qr-search").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
  document.getElementById("qr-select-all").onclick = () => { lastResults.forEach(i => selected[i.sap_code] = i); search(); updateCount(); };

  document.getElementById("qr-generate").onclick = async () => {
    const items = Object.values(selected);
    if (!items.length) { alert("Select at least one item."); return; }
    const area = document.getElementById("qr-print-area");
    area.innerHTML = "";
    const baseUrl = location.origin + location.pathname;
    for (const item of items) {
      const card = document.createElement("div");
      card.className = "border rounded-lg p-3 text-center flex flex-col items-center";
      const canvas = document.createElement("canvas");
      card.appendChild(canvas);
      const label = document.createElement("div");
      label.className = "mt-2 text-xs";
      label.innerHTML = `<div class="font-mono font-semibold">${item.sap_code}</div><div>${item.description}</div>`;
      card.appendChild(label);
      area.appendChild(card);
      await QRCode.toCanvas(canvas, `${baseUrl}#/item/${encodeURIComponent(item.sap_code)}`, { width: 140 });
    }
    document.getElementById("qr-print").classList.remove("hidden");
  };
  document.getElementById("qr-print").onclick = () => window.print();
}

// ---------------- BULK RECEIPT (AI-assisted Excel upload) ----------------
async function renderBulkReceipt() {
  const app = document.getElementById("app");
  app.innerHTML = shell(`
    <div class="bg-white rounded-xl shadow p-4 mb-4">
      <h2 class="font-bold navy mb-2">Bulk Receipt from Excel (AI-assisted)</h2>
      <p class="text-sm text-gray-500 mb-3">Upload the purchase/GRN excel as-is — any column layout. AI will read it into a list of SAP code / description / quantity. Review and correct before applying; nothing is saved until you confirm.</p>
      <input id="br-file" type="file" accept=".xlsx,.xls,.csv" class="text-sm" />
      <div id="br-status" class="text-sm mt-2"></div>
    </div>
    <div id="br-preview"></div>
  `);
  bindShell();

  document.getElementById("br-file").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const statusBox = document.getElementById("br-status");
    statusBox.textContent = "Reading file...";
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false, defval: "" })
        .map(r => r.map(c => String(c)))
        .filter(r => r.some(c => c.trim() !== ""));
      if (!rows.length) { statusBox.textContent = "No data found in the file."; return; }
      statusBox.textContent = `Parsed ${rows.length} rows. Asking AI to extract items...`;
      const data = await api("/api/ai/bulk-receipt/parse", { method: "POST", body: JSON.stringify({ rows }) });
      statusBox.innerHTML = `<span class="text-green-600">Extracted ${data.preview.length} item lines from ${data.rows_seen} rows read.</span>`;
      renderPreview(data.preview);
    } catch (err) {
      statusBox.innerHTML = `<span class="text-red-600">${err.message}</span>`;
    }
  });

  function renderPreview(preview) {
    const box = document.getElementById("br-preview");
    box.innerHTML = `
      <div class="bg-white rounded-xl shadow p-4">
        <table class="w-full text-sm">
          <thead class="text-left text-gray-500 border-b">
            <tr><th class="py-2">SAP Code</th><th>Description</th><th>Qty Received</th><th>Status</th></tr>
          </thead>
          <tbody id="br-rows">
            ${preview.map((p, idx) => `
              <tr class="border-b" data-idx="${idx}">
                <td class="py-1"><input class="border rounded px-2 py-1 text-xs w-32 font-mono" data-field="sap_code" value="${p.sap_code}" /></td>
                <td><input class="border rounded px-2 py-1 text-xs w-full" data-field="description" value="${p.description.replace(/"/g,'&quot;')}" /></td>
                <td><input type="number" class="border rounded px-2 py-1 text-xs w-20" data-field="qty" value="${p.qty}" /></td>
                <td><span class="text-xs px-2 py-0.5 rounded-full ${p.status==='new'?'bg-blue-100 text-blue-800':'bg-gray-100 text-gray-700'}">${p.status==='new'?'new item':'add to stock'}</span></td>
              </tr>`).join("")}
          </tbody>
        </table>
        <button id="br-apply" class="mt-4 bg-orange text-white px-4 py-2 rounded-lg font-semibold text-sm">Confirm & Apply to Stock</button>
        <div id="br-apply-msg" class="text-sm mt-2"></div>
      </div>
    `;
    document.getElementById("br-apply").onclick = async () => {
      const rows = document.querySelectorAll("#br-rows tr");
      const items = Array.from(rows).map(tr => ({
        sap_code: tr.querySelector('[data-field=sap_code]').value.trim(),
        description: tr.querySelector('[data-field=description]').value.trim(),
        qty: parseInt(tr.querySelector('[data-field=qty]').value) || 0,
      })).filter(i => i.qty > 0);
      try {
        const res = await api("/api/ai/bulk-receipt/apply", { method: "POST", body: JSON.stringify({ items }) });
        document.getElementById("br-apply-msg").innerHTML =
          `<span class="text-green-600">Done — ${res.summary.updated} item(s) restocked, ${res.summary.created} new item(s) created, ${res.summary.skipped} skipped.</span>`;
      } catch (e) {
        document.getElementById("br-apply-msg").innerHTML = `<span class="text-red-600">${e.message}</span>`;
      }
    };
  }
}

        </table>
        </div>
        <div class="text-xs text-gray-400 mt-2">Showing latest ${data.issues.length} (max 200) — narrow the filters or use Download CSV for the full range.</div>
      ` : `<div class="text-gray-400">No matching issue records.</div>`;
    } catch (e) { box.textContent = "Error: " + e.message; }
  }

  document.getElementById("il-filter").onclick = load;
  document.getElementById("il-download").onclick = async () => {
    const msg = document.getElementById("il-status-msg");
    msg.textContent = "Preparing download...";
    try {
      const res = await fetch(`/api/issues/export?${params().toString()}`, {
        headers: { Authorization: "Bearer " + state.token },
      });
      if (!res.ok) { const d = await res.json().catch(()=>({})); throw new Error(d.error || "Export failed"); }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `egstore_issue_log_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
      msg.textContent = "";
    } catch (e) { msg.innerHTML = `<span class="text-red-600">${e.message}</span>`; }
  };

  await load();
}

// ---------------- ROUTER ----------------
function checkHashRoute() {
  const m = location.hash.match(/^#\/item\/(.+)$/);
  if (m) { state.view = "item-detail"; state.selectedItemCode = decodeURIComponent(m[1]); return true; }
  return false;
}
window.addEventListener("hashchange", () => { if (checkHashRoute()) render(); });

function render() {
  if (!state.token || !state.user) { renderLogin(); return; }
  checkHashRoute();
  const views = {
    dashboard: renderDashboard, items: renderItems, issue: renderIssue,
    approvals: renderApprovals, indents: renderIndents, users: renderUsers,
    qrcodes: renderQRCodes, bulkreceipt: renderBulkReceipt, "item-detail": renderItemDetail,
    issuelog: renderIssueLog,
  };
  (views[state.view] || renderDashboard)();
}
checkHashRoute();
render();
</script>
</body>
</html>
