name = "egstore"
main = "src/index.js"
compatibility_date = "2026-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "egstore-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[ai]
binding = "AI"

# Set the real secret before deploying:
#   wrangler secret put JWT_SECRET
[vars]
# JWT_SECRET is set via `wrangler secret put JWT_SECRET` (do NOT put real secret here)
