name = "egstore"
main = "src/index.js"
compatibility_date = "2026-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "egstore-db"
database_id = "c15edcf4-0840-4fce-b9ae-622776ac862d"

[ai]
binding = "AI"

# Set the real secret before deploying:
#   wrangler secret put JWT_SECRET
[vars]
# JWT_SECRET is set via `wrangler secret put JWT_SECRET` (do NOT put real secret here)
